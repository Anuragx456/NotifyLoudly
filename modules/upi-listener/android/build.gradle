plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.notifyloudly'
version = '1.0.0'

android {
  namespace "com.notifyloudly.upilistener"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles "consumer-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.work:work-runtime-ktx:2.9.0"
}
